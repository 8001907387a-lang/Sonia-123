<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My E-Commerce Store</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Shop</a></li>
                <li><a href="#">Cart</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Featured Products</h1>
        <section class="product-list">
            <!-- Example Product 1 -->
            <div class="product">
                <img src="https://picsum.photos/600/400?random=1" alt="Product 1">
                <h3>Product 1</h3>
                <p>$19.99</p>
                <button class="add-to-cart">Add to Cart</button>
            </div>
            <!-- More products here -->
        </section>
    </main>

    <footer>
        <p>&copy; 2025 My E-Commerce Store</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
